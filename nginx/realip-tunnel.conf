# 2026-11-02 tunnel cutover: trust cloudflared via docker gateway for CF-Connecting-IP.
# 172.18.0.1 is the docker network gateway that cloudflared (running on the host)
# arrives from, so only that hop may set the client IP via CF-Connecting-IP.
set_real_ip_from 172.18.0.1;
real_ip_header CF-Connecting-IP;
