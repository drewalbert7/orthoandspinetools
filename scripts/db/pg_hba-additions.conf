# OST pg_hba.conf additions (audit item 1 follow-through). Draft: do not apply without the OST Operator.
# File: /var/lib/postgresql/data/pg_hba.conf inside orthoandspinetools-postgres (lives in the data volume).
# pg_hba is first-match. Insert these lines ABOVE the existing
#   host all all 172.18.0.0/16 scram-sha-256
# line. Apply with:  docker exec orthoandspinetools-postgres psql -U postgres -c 'select pg_reload_conf()'
# Reload only, NO restart. Check with: select * from pg_hba_file_rules where error is not null;  (must be 0 rows)
#
# Why: today the app containers (backend, bot-analytics) carry POSTGRES_PASSWORD in their env (env_file .env)
# and connect over the docker network as the superuser. After the DATABASE_URL switch, a compromised app
# container must not be able to log in as postgres, ost_migrator (except via the migrate one-off) or ost_backup.

# superuser: local socket inside the container only (docker exec), never over the network
host    all             postgres        0.0.0.0/0               reject
host    all             postgres        ::/0                    reject
# backup role: local socket only (backup script uses docker exec ... pg_dump -U ost_backup)
host    all             ost_backup      0.0.0.0/0               reject
host    all             ost_backup      ::/0                    reject
# no replication over the network (base backups run via docker exec on the local socket)
host    replication     all             0.0.0.0/0               reject
# app + migrator only to the app DB, scram only
host    orthoandspinetools  ost_app,ost_migrator  172.18.0.0/16  scram-sha-256
host    all             ost_app,ost_migrator  0.0.0.0/0          reject
#
# NOTE: the stock lines 'host all all 127.0.0.1/32 trust' and 'local all all trust' stay: they are only
# reachable from inside the container (docker exec == root on the host anyway). Tightening them
# would break every cron script that runs `psql -U postgres` without a password.
