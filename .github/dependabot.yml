# Grouped weekly Dependabot version updates (fleet automation plan, piece 3).
# One grouped PR per ecosystem, max 1 open PR each. Security-only auto PRs are
# not enabled here. Merges only with Drew's OK.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/backend"
      - "/e2e"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      npm-all:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      docker-all:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      github-actions-all:
        patterns:
          - "*"
