# Destructive DB / volume / backup operation gate (audit item 3). Blocks the PR on a hit.
# Make it a REQUIRED status check on main (branch protection), or the gate is advisory only.
# Trigger is pull_request only (never pull_request_target), so fork PRs get a read-only token and no
# secrets. Same-repo PRs still get the job-level scopes below (only the clear job can write, to PR labels).
name: db-guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  # Sticky destructive-ok would approve every later DESTRUCTIVE-OK marker. Drop it on each push.
  clear-destructive-ok-on-push:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: write   # remove the label
    steps:
      - name: Remove destructive-ok label on synchronize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fetch first so an API error fails the job (and with it db-guard) instead of skipping the removal.
          labels="$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')"
          if printf '%s\n' "$labels" | grep -Fxq 'destructive-ok'; then
            gh api --method DELETE "repos/$REPO/issues/$PR/labels/destructive-ok"
            echo "Removed destructive-ok (re-apply after reviewing the new head)."
          else
            echo "destructive-ok not present; nothing to remove."
          fi

  db-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Run after label clear so DB_GUARD_APPROVED reflects the post-synchronize state.
    needs: [clear-destructive-ok-on-push]
    # Always run (a skipped job reports success); the first step fails unless the clear job did what it should.
    if: always()
    permissions:
      contents: read
      issues: read           # PR timeline (label events) for the approval check
      pull-requests: read
    steps:
      - name: Require the label-clear job result (success on synchronize, skipped otherwise)
        env:
          ACTION: ${{ github.event.action }}
          CLEAR_RESULT: ${{ needs.clear-destructive-ok-on-push.result }}
        run: |
          set -euo pipefail
          expected=skipped
          if [ "$ACTION" = synchronize ]; then expected=success; fi
          if [ "$CLEAR_RESULT" != "$expected" ]; then
            echo "db-guard: clear-destructive-ok-on-push result is '$CLEAR_RESULT' (expected '$expected' for '$ACTION'). Failing closed."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need the base commit for base...head
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Override needs BOTH the DESTRUCTIVE-OK marker in the change AND this label (Drew / CEO only).
      # The label counts only if its latest labeled event is newer than the head commit and was applied
      # by an allowlisted human maintainer (db-guard.mjs labelApproval). Events come from the read-only API.
      # Run the guard script from the BASE commit so a PR cannot neuter the gate by editing it.
      - name: db-guard from base SHA (lines added by this PR)
        env:
          # synchronize keeps stale labels in the event payload; never trust them on a new push
          DB_GUARD_APPROVED: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'destructive-ok') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          GUARD_DIR="$(mktemp -d)"
          cleanup() { rm -rf "$GUARD_DIR"; }
          trap cleanup EXIT
          # destructive-ok label events (one JSON object per line) and the head commit date.
          gh api --paginate "repos/$REPO/issues/$PR/timeline?per_page=100" \
            --jq '.[] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "destructive-ok") | {event, created_at, label: {name: .label.name}, actor: {login: .actor.login, type: .actor.type}}' \
            | jq -c . > "$GUARD_DIR/label-events.ndjson"
          export DB_GUARD_LABEL_EVENTS="$GUARD_DIR/label-events.ndjson"
          DB_GUARD_HEAD_DATE="$(git show -s --format=%cI "$HEAD_SHA")"
          export DB_GUARD_HEAD_DATE
          if git cat-file -e "${BASE_SHA}:scripts/db-guard/db-guard.mjs" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/db-guard/db-guard.mjs" > "$GUARD_DIR/db-guard.mjs"
            echo "Running db-guard.mjs from base ${BASE_SHA}"
          else
            # First introduction on this branch: base has no guard yet; use HEAD copy.
            cp scripts/db-guard/db-guard.mjs "$GUARD_DIR/db-guard.mjs"
            echo "Base has no db-guard.mjs; using HEAD copy (transitional)"
          fi
          # Fail closed: node must exit nonzero on BLOCK.
          node "$GUARD_DIR/db-guard.mjs" --diff "$BASE_SHA" "$HEAD_SHA"
