name: Pre-deploy Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: production
  POSTGRES_PASSWORD: test_password_ci_only
  OST_APP_DB_PASSWORD: ci_app_password_0123456789abcdef
  OST_MIGRATOR_DB_PASSWORD: ci_migrator_password_0123456789ab
  OST_BACKUP_DB_PASSWORD: ci_backup_password_0123456789abcd
  JWT_SECRET: test_jwt_secret_ci_only_not_for_production

jobs:
  # PHI leak gate. Runs first; every other job needs it. Prints file:line + rule only (values masked).
  phi-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: phi-guard scan (all tracked files)
        run: sh scripts/phi-guard/phi-scan.sh --all

      - name: check-no-em-dash (no U+2014/U+2013 in frontend/src, frontend/public, index.html, backend/src, backend/scripts, backend/prisma)
        run: python3 scripts/check-no-em-dash.py

  backend-unit-tests:
    needs: phi-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci --include=dev

      - name: Backend unit tests (rate limiter, safety signal, MAUDE facet, FDA helpers, sort)
        working-directory: ./backend
        run: npm test

  deploy-rollback-test:
    needs: phi-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker versions
        run: docker version && docker compose version

      - name: Shellcheck deploy scripts
        run: shellcheck -S warning deploy.sh scripts/lib/deploy-rollback.sh scripts/lib/deploy-disk-prune.sh scripts/tests/deploy-rollback.test.sh scripts/tests/deploy-prune-guard.test.sh scripts/tests/deploy-db-order.test.sh scripts/predeploy-db-snapshot.sh scripts/db-migrate.sh scripts/db/restore-test.sh scripts/db/ost-archive-wal.sh scripts/backup/ost-db-backup.sh scripts/backup/ost-wal-ship.sh scripts/backup/ost-basebackup.sh scripts/tests/dockerignore-env.test.sh scripts/tests/backup-umask-r2-message.test.sh scripts/database-backup-production.sh scripts/analytics-backup.sh scripts/tests/jwt-secret-fail-closed.test.sh

      - name: deploy.sh prune guard (no volume/system/image prune or rmi; prune only after passing health; disk check below 5G)
        run: bash scripts/tests/deploy-prune-guard.test.sh

      - name: deploy.sh rollback simulation (failed check -> previous image IDs; passing check -> new build)
        run: bash scripts/tests/deploy-rollback.test.sh

      - name: deploy.sh DB order (snapshot -> build -> migrate as ost_migrator -> switch; fail-closed)
        run: bash scripts/tests/deploy-db-order.test.sh

      - name: No .env files in docker build contexts (planted .env files must not reach the image)
        run: bash scripts/tests/dockerignore-env.test.sh

      - name: Backup dump umask 077 and SKIP_R2 success message (static)
        run: bash scripts/tests/backup-umask-r2-message.test.sh

      - name: JWT_SECRET fail-closed (compose :? and no backend placeholders)
        run: bash scripts/tests/jwt-secret-fail-closed.test.sh

  predeploy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: phi-guard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create required env files
        run: |
          cat > .env << EOF
          NODE_ENV=production
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          OST_APP_DB_PASSWORD=${{ env.OST_APP_DB_PASSWORD }}
          JWT_SECRET=${{ env.JWT_SECRET }}
          DOMAIN=localhost
          VITE_API_URL=/api
          VITE_SITE_URL=http://localhost
          EOF
          touch .env.cloudinary

      - name: Create SSL certificates for nginx
        run: |
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout nginx/ssl/key.pem \
            -out nginx/ssl/cert.pem \
            -subj "/C=US/ST=CI/L=CI/O=CI/CN=localhost"

      - name: Create nginx logs directory
        run: mkdir -p nginx/logs

      - name: Copy HTTP-only nginx config for CI
        run: |
          # Use a simpler HTTP-only config for CI
          cat > nginx/nginx.conf << 'NGINX_CONF'
          worker_processes auto;
          error_log /var/log/nginx/error.log warn;
          pid /var/run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for"';

              access_log /var/log/nginx/access.log main;
              sendfile on;
              keepalive_timeout 65;

              upstream frontend {
                  server frontend:3000;
              }

              upstream backend {
                  server backend:3001;
              }

              server {
                  # HTTPS like production: the backend 301s any request whose
                  # X-Forwarded-Proto is not https when NODE_ENV=production, so an
                  # HTTP-only CI stack can never load /api data in the browser.
                  listen 80;
                  listen 443 ssl;
                  server_name localhost;
                  ssl_certificate /etc/nginx/ssl/cert.pem;
                  ssl_certificate_key /etc/nginx/ssl/key.pem;

                  location /api/ {
                      proxy_pass http://backend/api/;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }

                  location = /sitemap.xml {
                      proxy_pass http://backend/sitemap.xml;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header Connection "";
                  }

                  location / {
                      proxy_pass http://frontend;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }
              }
          }
          NGINX_CONF

      - name: Build and start services
        run: |
          # postgres_data is external in prod (audit item 2); CI creates it. docker-compose.ci.yml runs
          # scripts/db/roles.sql at initdb so the app runs as ost_app (DML only), like prod.
          docker volume create orthoandspinetools-main_postgres_data
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up -d --build
          echo "Waiting for services to be healthy..."
          sleep 45

      - name: Check service health
        run: |
          echo "Checking postgres..."
          docker compose -f docker-compose.prod.yml exec -T postgres pg_isready -U postgres -d orthoandspinetools || true
          echo "Checking backend..."
          docker compose -f docker-compose.prod.yml logs backend | tail -20
          echo "Checking frontend..."
          docker compose -f docker-compose.prod.yml logs frontend | tail -20
          echo "Checking nginx..."
          docker compose -f docker-compose.prod.yml logs nginx | tail -20
          echo "Testing HTTP endpoint..."
          curl -v http://localhost/ || true

      - name: Create schema and seed fixture data
        run: |
          # CI starts with an empty database. The checks now FAIL on an empty home feed or
          # implant directory, so create the schema and load minimal fixture rows.
          # (Migration history is not replayable from zero, so use db push in CI only.)
          # Schema is created as the superuser (the app role cannot run DDL). CI-only throwaway DB.
          docker compose -f docker-compose.prod.yml exec -T \
            -e DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/orthoandspinetools" \
            backend npx prisma db push --skip-generate --accept-data-loss  # DESTRUCTIVE-OK: CI-throwaway-db
          docker compose -f docker-compose.prod.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U postgres -d orthoandspinetools < e2e/fixtures/ci-seed.sql
          curl -sfk "https://localhost/api/posts?limit=5" | head -c 300; echo
          curl -sfk "https://localhost/api/implants" | head -c 300; echo

      - name: Built images carry no .env file (runtime env comes from compose env_file + environment)
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend sh -c 'set -- /app/.env /app/.env.*; for f; do [ -e "$f" ] && { echo "env file baked into image: $f"; exit 1; }; done; echo "no env file in /app"'
          docker compose -f docker-compose.prod.yml exec -T backend node -e 'if (!process.env.JWT_SECRET || !process.env.DATABASE_URL) { console.error("runtime env missing"); process.exit(1) } console.log("runtime env present from compose")'

      - name: Restore test (dump the seeded CI database, restore into a throwaway postgres 15.14, compare counts)
        run: |
          docker compose -f docker-compose.prod.yml exec -T postgres pg_dump -U postgres -d orthoandspinetools \
            | gzip -6 | bash scripts/db/restore-test.sh --format plain-gz --min-tables 30 --require-rows implants,posts

      - name: Install Playwright
        working-directory: ./e2e
        run: |
          npm ci --include=dev
          npx playwright install chromium --with-deps

      - name: Run pre-deploy checks
        working-directory: ./e2e
        env:
          BASE_URL: https://localhost
          CHECK_IGNORE_HTTPS_ERRORS: '1'
          CI: true
        run: npm run predeploy:check

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.prod.yml down
