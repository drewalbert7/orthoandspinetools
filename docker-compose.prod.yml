services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: orthoandspinetools-postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: orthoandspinetools
      POSTGRES_USER: postgres
      # No weak fallback: compose refuses to start if .env lacks it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # WAL archiving for PITR (audit item 9). Off unless .env sets PG_ARCHIVE_MODE=on (prod only), so CI
    # and local stacks are unaffected. archive_mode changes need a postgres container restart.
    command:
      - postgres
      - -c
      - archive_mode=${PG_ARCHIVE_MODE:-off}
      - -c
      - archive_command=/usr/local/bin/ost-archive-wal.sh %p %f
      - -c
      - archive_timeout=${PG_ARCHIVE_TIMEOUT:-300}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Host spool (prod: /mnt/HC_Volume_106016238/ost-wal-spool, owned 70:70, mode 700). Encryption and
      # R2 shipping happen on the host (ost-wal-ship.sh); no key or token inside this container.
      - ${OST_WAL_SPOOL_HOST:-./.wal-spool}:/wal-spool
      - ./scripts/db/ost-archive-wal.sh:/usr/local/bin/ost-archive-wal.sh:ro
    networks:
      - orthoandspinetools-network
    restart: unless-stopped
    shm_size: "256mb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orthoandspinetools"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orthoandspinetools-backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
      - .env.cloudinary
    environment:
      NODE_ENV: production
      PORT: 3001
      # Pool limits per instance — lower connection_limit when running multiple backend replicas
      # Least-privilege runtime role (audit item 1): DML only, no DDL/TRUNCATE/DROP. Migrations use
      # ost_migrator via scripts/db-migrate.sh. Password must be URL-safe (hex).
      DATABASE_URL: postgresql://ost_app:${OST_APP_DB_PASSWORD:?OST_APP_DB_PASSWORD must be set in .env}@postgres:5432/orthoandspinetools?connection_limit=10&pool_timeout=20
      # env_file .env also injects the superuser password; blank it inside the app container.
      POSTGRES_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_EXPIRES_IN: 7d
      # Backend reads CORS_ORIGINS (plural); comma-separated. Defaults in code if unset.
      CORS_ORIGINS: https://orthoandspinetools.com,https://www.orthoandspinetools.com
      # Canonical origin for OG/HTML share previews (optional; else X-Forwarded-* from nginx)
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://orthoandspinetools.com}
      # Media: cloudflare = Images+Stream (Reddit-like sizing); r2 / cloudinary as alternatives
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-cloudflare}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_IMAGES_HASH: ${CLOUDFLARE_IMAGES_HASH:-}
      CLOUDFLARE_IMAGES_VARIANT: ${CLOUDFLARE_IMAGES_VARIANT:-public}
      R2_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-https://49e6cba47866e778eafedc9bbb00a607.r2.cloudflarestorage.com}
      R2_BUCKET: ${R2_BUCKET:-orthoandspinetools}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # Amazon SES (optional — omit or leave empty to skip sending; see backend/env.example)
      AWS_SES_REGION: ${AWS_SES_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-OrthoAndSpineTools}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      AWS_SES_CONFIGURATION_SET: ${AWS_SES_CONFIGURATION_SET:-}
      AWS_SES_SNS_TOPIC_ARN: ${AWS_SES_SNS_TOPIC_ARN:-}
      AWS_SNS_VERIFY_SIGNATURES: ${AWS_SNS_VERIFY_SIGNATURES:-true}
      AUTH_EMAIL_RATE_LIMIT_MAX: ${AUTH_EMAIL_RATE_LIMIT_MAX:-5}
      AUTH_EMAIL_RATE_LIMIT_WINDOW_MS: ${AUTH_EMAIL_RATE_LIMIT_WINDOW_MS:-900000}
      EMAIL_DIGEST_ENABLED: ${EMAIL_DIGEST_ENABLED:-true}
      EMAIL_DIGEST_MIN_HOURS: ${EMAIL_DIGEST_MIN_HOURS:-96}
      EMAIL_DIGEST_LOOKBACK_HOURS: ${EMAIL_DIGEST_LOOKBACK_HOURS:-168}
      EMAIL_DIGEST_MAX_USERS_PER_RUN: ${EMAIL_DIGEST_MAX_USERS_PER_RUN:-200}
      EMAIL_DIGEST_MAX_POSTS_PER_EMAIL: ${EMAIL_DIGEST_MAX_POSTS_PER_EMAIL:-5}
      EMAIL_DIGEST_CRON_SECRET: ${EMAIL_DIGEST_CRON_SECRET:-}
      # openFDA MAUDE trends (optional key raises rate limits; warm cron uses MAUDE_CRON_SECRET)
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      MAUDE_CRON_SECRET: ${MAUDE_CRON_SECRET:-}
      # Inbox for "request we add this brand" on /maude (SES). Falls back to UPTIME_ALERT_TO in code.
      MAUDE_REQUEST_TO: ${MAUDE_REQUEST_TO:-}
      GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-G-2HVXSX6V78}
      UPTIME_ALERT_TO: ${UPTIME_ALERT_TO:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - orthoandspinetools-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin /api (proxied by nginx to backend). Override only if API is on another host.
        VITE_API_URL: ${VITE_API_URL:-/api}
        # Canonical origin for SEO/JSON-LD at build time (browser still uses window.location when available).
        VITE_SITE_URL: ${VITE_SITE_URL:-https://orthoandspinetools.com}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-G-2HVXSX6V78}
    container_name: orthoandspinetools-frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - orthoandspinetools-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Bot / LLM agent analytics (nginx access-log tailer)
  bot-analytics:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orthoandspinetools-bot-analytics
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ost_app:${OST_APP_DB_PASSWORD:?OST_APP_DB_PASSWORD must be set in .env}@postgres:5432/orthoandspinetools?connection_limit=5&pool_timeout=20
      POSTGRES_PASSWORD: ""
      SITE_ACCESS_LOG: /var/log/nginx/access.log
      BOT_IGNORE_IPS: ${BOT_IGNORE_IPS:-127.0.0.1,::1,5.161.98.234,2a01:4ff:f0:6907::1,172.17.0.1,172.18.0.1}
      BOT_BACKFILL_DAYS: ${BOT_BACKFILL_DAYS:-14}
      BOT_TAIL_POLL_MS: ${BOT_TAIL_POLL_MS:-2000}
    volumes:
      - ./nginx/logs:/var/log/nginx:ro
    command: ["node", "dist/jobs/botLogTailer.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orthoandspinetools-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/log/nginx/access.log"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: orthoandspinetools-nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/ssl/certbot:/var/www/certbot
      - ./nginx/logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - orthoandspinetools-network
    restart: unless-stopped

volumes:
  # External (audit item 2): compose never creates or deletes it, so `down -v` cannot remove prod data.
  # Fresh hosts / CI must run `docker volume create orthoandspinetools-main_postgres_data` first.
  postgres_data:
    external: true
    name: orthoandspinetools-main_postgres_data

networks:
  orthoandspinetools-network:
    driver: bridge
